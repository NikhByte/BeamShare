name: Continuous Integration

on:
  push:
    branches: [ main, "jules/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Go Unit Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! go test -v ./... > test.log 2>&1; then
            cat test.log
            COMMENT_BODY=$(jq -n --arg body "### ❌ Go Test Failure Log (${{ matrix.os }})
\`\`\`
$(tail -n 120 test.log)
\`\`\`" '{body: $body}')
            curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$COMMENT_BODY" \
              "https://api.github.com/repos/${{ github.repository }}/issues/22/comments" || true
            exit 1
          fi

      - name: Run JavaScript Web Receiver Tests
        run: npm test

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Relay Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: beamshare-relay:test
